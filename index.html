<body class="bg-cyber-bg text-gray-200 font-sans overflow-x-hidden selection:bg-cyber-primary selection:text-black">

  <!-- Background Canvas for Particles -->

  <!-- React Code with Babel Compiler -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CUSTOM CANVAS PARTICLE SYSTEM ---
    function initParticleCanvas() {
      const canvas = document.getElementById('particle-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particles = [];
      let mouse = { x: null, y: null, radius: 150 };

      // Set canvas size
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Track mouse position
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener('mouseleave', () => {
        mouse.x = null;
        mouse.y = null;
      });

      class Particle {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.size = Math.random() * 2 + 1;
          this.baseX = this.x;
          this.baseY = this.y;
          this.density = (Math.random() * 30) + 10;
          this.vx = (Math.random() - 0.5) * 0.3;
          this.vy = (Math.random() - 0.5) * 0.3;
          this.color = Math.random() > 0.5 ? 'rgba(0, 242, 254, 0.4)' : 'rgba(155, 81, 224, 0.4)';
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
        }

        update() {
          // Bounce off walls
          if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
          if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

          // Simple smooth movement
          this.x += this.vx;
          this.y += this.vy;

          // Mouse Attraction / Repulsion
          if (mouse.x != null && mouse.y != null) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < mouse.radius) {
              let forceDirectionX = dx / distance;
              let forceDirectionY = dy / distance;
              let maxDistance = mouse.radius;
              let force = (maxDistance - distance) / maxDistance;
              
              // Pull slightly towards mouse
              this.x += forceDirectionX * force * 0.8;
              this.y += forceDirectionY * force * 0.8;
            }
          }
        }
      }

      // Generate particles
      const count = window.innerWidth < 768 ? 35 : 90;
      for (let i = 0; i < count; i++) {
        let x = Math.random() * canvas.width;
        let y = Math.random() * canvas.height;
        particles.push(new Particle(x, y));
      }

      // Draw connections
      function drawLines() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            let dx = particles[i].x - particles[j].x;
            let dy = particles[i].y - particles[j].y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 120) {
              const opacity = (1 - (dist / 120)) * 0.15;
              ctx.strokeStyle = `rgba(0, 242, 254, ${opacity})`;
              ctx.lineWidth = 0.5;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].draw();
          particles[i].update();
        }
        drawLines();
        requestAnimationFrame(animate);
      }
      animate();
    }

    // --- CUSTOM CURSOR HANDLER ---
    function initCustomCursor() {
      const cursor = document.getElementById('custom-cursor');
      const follower = document.getElementById('custom-cursor-follower');
      if (!cursor || !follower) return;

      let mouseX = 0, mouseY = 0;
      let followerX = 0, followerY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        
        cursor.style.top = mouseY + 'px';
        cursor.style.left = mouseX + 'px';
      });

      // Smooth lag effect for follower
      function updateFollower() {
        let dx = mouseX - followerX;
        let dy = mouseY - followerY;
        followerX += dx * 0.12;
        followerY += dy * 0.12;
        
        follower.style.top = followerY + 'px';
        follower.style.left = followerX + 'px';
        
        requestAnimationFrame(updateFollower);
      }
      updateFollower();

      // Detect clickables to add scale effect
      const clickables = document.querySelectorAll('a, button, [role="button"], input, textarea, select, .clickable-element');
      clickables.forEach(item => {
        item.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
        item.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
      });
    }

    // Refresh cursor bindings (needed when React re-renders or mounts new interactive items)
    function refreshCursorBindings() {
      setTimeout(() => {
        const clickables = document.querySelectorAll('a, button, [role="button"], input, textarea, select, .clickable-element');
        clickables.forEach(item => {
          // Remove potential duplicates by cloning
          const newItem = item.cloneNode(true);
          // Wait, cloning breaks React handlers! Instead, let's just add events directly safely
          item.removeEventListener('mouseenter', addCursorHover);
          item.removeEventListener('mouseleave', removeCursorHover);
          item.addEventListener('mouseenter', addCursorHover);
          item.addEventListener('mouseleave', removeCursorHover);
        });
      }, 100);
    }

    function addCursorHover() { document.body.classList.add('cursor-hover'); }
    function removeCursorHover() { document.body.classList.remove('cursor-hover'); }


    // --- REACT MAIN COMPONENT ---
    function App() {
      const [loading, setLoading] = useState(true);
      const [loadProgress, setLoadProgress] = useState(0);
      const [terminalLogs, setTerminalLogs] = useState([]);
      const [activeSection, setActiveSection] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [scrollPercentage, setScrollPercentage] = useState(0);

      // Typing animation variables
      const roles = [
        "Electronics & Communication Engineering Student",
        "Post-Quantum Cryptography Researcher",
        "AI & Software Development Enthusiast"
      ];
      const [currentRoleText, setCurrentRoleText] = useState('');
      const [roleIndex, setRoleIndex] = useState(0);
      const [isDeleting, setIsDeleting] = useState(false);
      const [typingSpeed, setTypingSpeed] = useState(100);

      // Form states
      const [formState, setFormState] = useState({ name: '', email: '', subject: '', message: '' });
      const [formStatus, setFormStatus] = useState('idle'); // idle | sending | success
      const [formLogs, setFormLogs] = useState([]);

      // Loader terminals simulation
      useEffect(() => {
        if (!loading) return;

        const bootMessages = [
          "> Initializing secure handshake...",
          "> Establishing quantum channel tunnel...",
          "> Kyber (ML-KEM) key encapsulation keys generated...",
          "> Dilithium (ML-DSA) sign authority verified...",
          "> Decrypting core portfolios [AES-256]...",
          "> Synthesizing ECE hardware node connection...",
          "> SECURE ACCESS GRANTED. Welcome to Lakshna S."
        ];

        let index = 0;
        const progressInterval = setInterval(() => {
          setLoadProgress((prev) => {
            if (prev >= 100) {
              clearInterval(progressInterval);
              setTimeout(() => {
                setLoading(false);
                // Trigger animation triggers
                setTimeout(() => {
                  initParticleCanvas();
                  initCustomCursor();
                  gsap.registerPlugin(ScrollTrigger);
                  initGSAPAnimations();
                }, 100);
              }, 600);
              return 100;
            }
            // Stagger addition of terminal logs based on progress
            const step = Math.floor(100 / bootMessages.length);
            const currentLogIndex = Math.floor(prev / step);
            if (currentLogIndex >= index && index < bootMessages.length) {
              setTerminalLogs((oldLogs) => [...oldLogs, bootMessages[index]]);
              index++;
            }
            return prev + 1;
          });
        }, 22);

        return () => clearInterval(progressInterval);
      }, [loading]);

      // Typing Animation effect
      useEffect(() => {
        if (loading) return;

        const handleTyping = () => {
          const currentFullText = roles[roleIndex];
          
          if (!isDeleting) {
            setCurrentRoleText(currentFullText.substring(0, currentRoleText.length + 1));
            setTypingSpeed(80); // Speed up typing
            
            if (currentRoleText === currentFullText) {
              // Pause at completion
              setTypingSpeed(2000);
              setIsDeleting(true);
            }
          } else {
            setCurrentRoleText(currentFullText.substring(0, currentRoleText.length - 1));
            setTypingSpeed(40); // Fast delete
            
            if (currentRoleText === '') {
              setIsDeleting(false);
              setRoleIndex((prev) => (prev + 1) % roles.length);
              setTypingSpeed(500); // Pause before starting next
            }
          }
        };

        const timer = setTimeout(handleTyping, typingSpeed);
        return () => clearTimeout(timer);
      }, [currentRoleText, isDeleting, roleIndex, loading, typingSpeed]);

      // Scroll Progress Indicator & Active Nav Link Indicator
      useEffect(() => {
        const handleScroll = () => {
          const scrollTop = window.scrollY;
          const docHeight = document.documentElement.scrollHeight - window.innerHeight;
          const scrollPct = (scrollTop / docHeight) * 100;
          setScrollPercentage(scrollPct);

          // Update active navigation link
          const sections = ['home', 'about', 'education', 'skills', 'projects', 'certifications', 'contact'];
          const offsets = sections.map(id => {
            const el = document.getElementById(id);
            return el ? { id, top: el.offsetTop, height: el.offsetHeight } : null;
          }).filter(Boolean);

          const currentSection = offsets.find(section => {
            return scrollTop >= (section.top - 200) && scrollTop < (section.top + section.height - 200);
          });

          if (currentSection) {
            setActiveSection(currentSection.id);
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Re-bind cursor elements on structural modifications
      useEffect(() => {
        if (!loading) {
          refreshCursorBindings();
        }
      }, [loading, activeSection, mobileMenuOpen, formStatus]);

      // Initialize GSAP scroll animations
      const initGSAPAnimations = () => {
        // Hero Section Entry
        gsap.from("#hero-content > *", {
          opacity: 0,
          y: 40,
          duration: 1,
          stagger: 0.2,
          ease: "power3.out"
        });

        gsap.from("#hero-graphic", {
          opacity: 0,
          scale: 0.8,
          duration: 1.5,
          ease: "elastic.out(1, 0.75)",
          delay: 0.4
        });

        // Scroll Triggers for individual cards and sections
        const revealElements = document.querySelectorAll(".reveal-element");
        revealElements.forEach(el => {
          gsap.from(el, {
            scrollTrigger: {
              trigger: el,
              start: "top 85%",
              toggleActions: "play none none none"
            },
            opacity: 0,
            y: 35,
            duration: 0.8,
            ease: "power2.out"
          });
        });

        // Timeline Progress Bar line
        gsap.from("#timeline-progress-line", {
          scrollTrigger: {
            trigger: "#education-timeline",
            start: "top 70%",
            end: "bottom 70%",
            scrub: true
          },
          scaleY: 0,
          transformOrigin: "top center",
          ease: "none"
        });

        // Stats card counting triggers
        const statNums = document.querySelectorAll(".stat-counter");
        statNums.forEach(num => {
          const val = parseFloat(num.getAttribute("data-val"));
          const isDecimal = val % 1 !== 0;
          const target = { count: 0 };
          
          gsap.to(target, {
            scrollTrigger: {
              trigger: num,
              start: "top 90%",
              toggleActions: "play none none none"
            },
            count: val,
            duration: 2,
            ease: "power3.out",
            onUpdate: () => {
              if (isDecimal) {
                num.innerText = target.count.toFixed(2);
              } else {
                num.innerText = Math.floor(target.count).toString();
              }
            }
          });
        });
      };

      // Handle resume click with standard download
      const handleDownloadResume = (e) => {
        // The resume placeholder was created at path "./resume_placeholder.pdf"
        // Let's create an anchor and trigger download
        const link = document.createElement('a');
        link.href = 'resume_placeholder.pdf';
        link.download = 'Lakshna_S_Resume.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Form submission handler
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formState.name || !formState.email || !formState.subject || !formState.message) {
          alert("All fields are required!");
          return;
        }

        setFormStatus('sending');
        setFormLogs(["> Initiating hand-shake...", "> Encrypting inputs..."]);

        // Simulate sending process
        setTimeout(() => {
          setFormLogs(prev => [...prev, "> Generating digital signature...", "> Verifying integrity..."]);
          setTimeout(() => {
            setFormLogs(prev => [...prev, "> Tunneling packet through quantum lattice...", "> Message successfully decrypted by recipient node."]);
            setTimeout(() => {
              setFormStatus('success');
            }, 800);
          }, 800);
        }, 800);
      };

      // 3D Tilt Avatar graphic
      const avatarRef = useRef(null);
      const handleAvatarMouseMove = (e) => {
        if (!avatarRef.current) return;
        const rect = avatarRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const xPct = (x / rect.width) - 0.5;
        const yPct = (y / rect.height) - 0.5;

        // Apply rotation
        avatarRef.current.style.transform = `perspective(800px) rotateY(${xPct * 25}deg) rotateX(${yPct * -25}deg) scale3d(1.03, 1.03, 1.03)`;
        avatarRef.current.style.boxShadow = `${xPct * -15}px ${yPct * -15}px 30px rgba(0, 242, 254, 0.25), ${xPct * 15}px ${yPct * 15}px 30px rgba(155, 81, 224, 0.25)`;
      };

      const handleAvatarMouseLeave = () => {
        if (!avatarRef.current) return;
        avatarRef.current.style.transform = `perspective(800px) rotateY(0deg) rotateX(0deg) scale3d(1, 1, 1)`;
        avatarRef.current.style.boxShadow = `0 8px 32px 0 rgba(0, 0, 0, 0.5)`;
      };

      // Interactive Skills Progress Indicator trigger
      const [skillsInView, setSkillsInView] = useState(false);
      const skillsRef = useRef(null);
      useEffect(() => {
        if (loading) return;
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setSkillsInView(true);
            observer.disconnect();
          }
        }, { threshold: 0.1 });

        if (skillsRef.current) {
          observer.observe(skillsRef.current);
        }
        return () => observer.disconnect();
      }, [loading]);


      if (loading) {
        return (
          <div className="fixed inset-0 bg-[#030205] z-50 flex flex-col justify-center items-center font-mono px-6">
            <div className="max-w-xl w-full border border-cyber-secondary/20 p-6 rounded-lg glass-panel relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-cyber-primary via-cyber-secondary to-cyber-primary animate-pulse"></div>
              
              <div className="flex justify-between items-center mb-6">
                <span className="text-cyber-primary text-xs uppercase tracking-widest font-orbitron font-bold">LAKSHNA_SECURE_BOOT.SYS</span>
                <span className="text-cyber-secondary text-xs">{loadProgress}%</span>
              </div>
              
              {/* Load logs */}
              <div className="bg-black/50 border border-white/5 rounded p-4 h-48 overflow-y-auto mb-6 text-xs text-green-400 space-y-2 font-mono scrollbar-thin select-none">
                {terminalLogs.map((log, i) => (
                  <div key={i} className="animate-fade-in">{log}</div>
                ))}
                <div className="w-2 h-4 bg-green-400 animate-ping inline-block"></div>

                            <div className="w-1.5 h-3 bg-green-400 animate-ping inline-block"></div>
                          </div>
                        )}

                        {/* Submit Button */}
                        <button 
                          type="submit" 
                          disabled={formStatus === 'sending'}
                          className="cyber-btn w-full bg-gradient-to-r from-cyber-primary to-cyber-secondary text-black font-orbitron font-extrabold text-xs tracking-widest py-4 rounded-lg hover:shadow-neon-cyan active:scale-98 transition-all disabled:opacity-50"
                        >
                          {formStatus === 'sending' ? 'TRANSMITTING PACKET...' : 'TRANSMIT ENCRYPTED MESSAGE'}
                        </button>

                      </form>
                    )}
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* --- FOOTER --- */}
          <footer className="border-t border-white/5 py-12 px-6 bg-[#030305] text-center relative z-20">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center space-y-6 md:space-y-0">
              
              <span className="font-orbitron text-xs text-gray-500 uppercase tracking-widest">
                DESIGNED &amp; DEVELOPED BY <span className="text-cyber-primary text-glow-cyan">LAKSHNA S</span>
              </span>

              <span className="font-mono text-[10px] text-gray-600">
                &copy; {new Date().getFullYear()} // ALL SCHEMES SECURED.
              </span>
              
              <a 
                href="#home"
                className="w-10 h-10 border border-white/10 bg-white/2 rounded-full flex items-center justify-center text-gray-400 hover:text-cyber-primary hover:border-cyber-primary transition-all duration-300 active:scale-90"
              >
                ▲
              </a>
            </div>
          </footer>
        </div>
      );
    }

    // Mount to root
    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>

</body>
</html>
